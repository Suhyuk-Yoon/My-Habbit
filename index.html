<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한자혼용 변환기 v0.5.3</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color-scheme:light dark}
body{max-width:920px;margin:auto;padding:22px;line-height:1.6}
textarea,input,select,button{font:inherit}
textarea{width:100%;box-sizing:border-box;min-height:160px;padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.box{border:1px solid #888;border-radius:10px;padding:12px;min-height:80px;white-space:pre-wrap}
.grid{display:grid;gap:18px}@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
input[type=password],input[type=url]{min-width:280px;padding:8px}
button,select{padding:8px 11px}
.small{font-size:.9rem;opacity:.85}
.log{border-top:1px solid #8885;padding:8px 0}
fieldset{border:1px solid #888;border-radius:10px}
</style>
</head>
<body>
<h1>한자혼용 변환기 <small>v0.5.3 Onyong-eo API Fix</small></h1>
<p>GitHub Pages에서 실행하고, 국립국어원 온용어 요청은 Cloudflare Worker가 중계합니다.</p>

<fieldset>
<legend>연결 설정</legend>
<div class="row">
<label>Worker 주소
<input id="proxy" type="url" placeholder="https://xxxx.xxxx.workers.dev/"></label>
<button id="saveProxy">Worker 주소 저장</button>
<button id="testProxy">Worker 연결 테스트</button>
</div>
<div class="row">
<label>온용어 API 키
<input id="key" type="password" autocomplete="off" placeholder="발급받은 인증 키"></label>
<button id="saveKey">키 저장</button>
<button id="forgetKey">키 삭제</button>
</div>
<label><input id="online" type="checkbox" checked> 모르는 단어는 온용어에서 조회</label>
<p class="small">Worker 주소와 API 키는 이 브라우저의 localStorage에만 저장됩니다.</p>
<span id="cacheStatus"></span>
</fieldset>

<p><label><strong>원문</strong></label></p>
<textarea id="input" placeholder="정부는 새로운 경제 정책을 발표하고 국제 금융 시장의 변화를 분석하였다."></textarea>

<div class="row">
<label>강도
<select id="strength">
<option value="1">1 — 약하게</option>
<option value="2" selected>2 — 일반 혼용</option>
<option value="3">3 — 옛 신문 풀파워</option>
</select></label>
<button id="convert">변환</button>
<button id="clear">초기화</button>
</div>

<p id="notice" role="status" aria-live="polite"></p>

<div class="grid">
<section><h2>변환 당시 원본</h2><div id="original" class="box"></div><button id="copyOriginal">원본 복사</button></section>
<section><h2>변환문</h2><div id="converted" class="box"></div><button id="copyConverted">변환문 복사</button></section>
</div>

<details><summary>판별/조회 기록</summary><div id="logs"></div></details>

<script>
const SEED={
"정부":[{hanja:"政府",definition:"나라의 행정을 맡아보는 국가 기관",source:"내장"}],
"경제":[{hanja:"經濟",definition:"재화와 용역의 생산 분배 소비와 관련된 활동",source:"내장"}],
"정책":[{hanja:"政策",definition:"정치적 목적을 실현하기 위한 방침",source:"내장"}],
"발표":[{hanja:"發表",definition:"어떤 사실이나 결과를 널리 알림",source:"내장"}],
"교육":[{hanja:"敎育",definition:"지식과 기능을 가르치고 인격을 기름",source:"내장"}],
"학생":[{hanja:"學生",definition:"학교에서 공부하는 사람",source:"내장"}],
"학습":[{hanja:"學習",definition:"배워서 익힘",source:"내장"}],
"환경":[{hanja:"環境",definition:"사람이나 생물을 둘러싼 주위 조건",source:"내장"}],
"개선":[{hanja:"改善",definition:"고쳐서 더 좋게 함",source:"내장"}],
"국제":[{hanja:"國際",definition:"나라와 나라 사이",source:"내장"}],
"금융":[{hanja:"金融",definition:"자금과 돈의 융통",source:"내장"}],
"시장":[{hanja:"市場",definition:"상품과 서비스가 거래되는 곳이나 영역",source:"내장"}],
"변화":[{hanja:"變化",definition:"상태나 성질이 달라짐",source:"내장"}],
"분석":[{hanja:"分析",definition:"대상을 나누어 자세히 살핌",source:"내장"}],
"연구":[{hanja:"硏究",definition:"깊이 조사하고 탐구함",source:"내장"}],
"기사":[
 {hanja:"記事",definition:"신문 잡지 방송 인터넷 등에 실린 보도 글 뉴스",source:"내장"},
 {hanja:"騎士",definition:"말을 타고 싸우는 중세의 무사 갑옷 왕국",source:"내장"},
 {hanja:"技士",definition:"기술 자격을 갖춘 기술자 엔지니어",source:"내장"}]
};

const $=s=>document.querySelector(s);
let CACHE={},snapshot={original:"",converted:""};

function load(){
  try{CACHE=JSON.parse(localStorage.getItem("hanjaMixerCache")||"{}")}catch{CACHE={}}
  $("#key").value=localStorage.getItem("stdictKey")||"";
  $("#proxy").value=localStorage.getItem("hanjaProxy")||"";
  status();
}
function status(){
  $("#cacheStatus").textContent=`내장 ${Object.keys(SEED).length}개 · 인터넷 캐시 ${Object.keys(CACHE).length}개 표제어`;
}
function getCandidates(w){return [...(CACHE[w]||[]),...(SEED[w]||[])]}
function toks(s){return new Set(s.match(/[가-힣]{2,}/g)||[])}
function score(c,ctx){
  let n=0,d=toks(c.definition||""),x=toks(ctx);
  for(const t of x) if(d.has(t)) n+=5;
  return n;
}
function choose(w,ctx){
  const a=getCandidates(w);
  if(!a.length) return null;
  return a.map(x=>[x,score(x,ctx)]).sort((a,b)=>b[1]-a[1])[0][0];
}
function cleanWord(w){return String(w||"").replace(/[-^·\d]+$/g,"").trim()}
function hanjaOnly(s){return (String(s||"").match(/[\u3400-\u9fff]+/g)||[]).join("")}

function normalizeItems(j,w){
  const ch=j?.channel||{};
  let ro=ch.return_object||[];
  if(!Array.isArray(ro)) ro=[ro];

  const out=[];
  for(const group of ro){
    let list=group?.resultlist||[];
    if(!Array.isArray(list)) list=[list];

    for(const it of list){
      if(!it) continue;
      const word=String(it.word||"").replace(/\^/g,"").trim();
      if(word!==w) continue;

      const origin=hanjaOnly(it.origin||"");
      if(!origin) continue;

      out.push({
        hanja:origin,
        definition:it.definition||"",
        pos:"",
        source:it.source||it.glossary||"국립국어원 온용어"
      });
    }
  }

  const uniq=[],seen=new Set();
  for(const x of out){
    const k=x.hanja+"|"+x.definition;
    if(!seen.has(k)){seen.add(k);uniq.push(x)}
  }
  return uniq;
}

function normalizeProxy(raw){
  let p=String(raw||"").trim();
  if(!p) throw new Error("Worker 주소가 없습니다.");
  if(!/^https?:\/\//i.test(p)) p="https://"+p;
  return p.replace(/\/+$/,"");
}

function buildLookupURL(proxy,key,w){
  const params=[
    ["key",key],
    ["apiSearchWord",w],
    ["start","1"],
    ["num","100"],
    ["sort","wt"]
  ];
  return proxy+"/?"+params.map(([k,v])=>
    encodeURIComponent(k)+"="+encodeURIComponent(String(v))
  ).join("&");
}

async function termLookup(w){
  const key=$("#key").value.trim();
  if(!key) throw new Error("온용어 API 키가 없습니다.");

  const proxy=normalizeProxy($("#proxy").value);
  const requestURL=buildLookupURL(proxy,key,w);

  let r;
  try{
    r=await fetch(requestURL,{method:"GET"});
  }catch(e){
    throw new Error("Worker 요청 실패: "+e.message);
  }

  if(!r.ok) throw new Error("Proxy HTTP "+r.status);

  const raw=await r.text();
  let j;
  try{
    j=JSON.parse(raw);
  }catch{
    throw new Error("온용어 응답이 JSON이 아닙니다: "+raw.replace(/\s+/g," ").slice(0,120));
  }

  const ro=j?.channel?.return_object;
  const groups=Array.isArray(ro)?ro:(ro?[ro]:[]);
  for(const g of groups){
    const code=String(g?.returnCode??"");
    if(code && code!=="1"){
      throw new Error(g?.message||("온용어 API 오류 코드 "+code));
    }
  }

  return normalizeItems(j,w);
}

function possibleWords(text){
  const runs=[...text.matchAll(/[가-힣]+/g)],arr=[];
  for(const m of runs){
    const s=m[0],base=m.index;
    for(let i=0;i<s.length;i++){
      for(let len=Math.min(6,s.length-i);len>=2;len--){
        arr.push({word:s.slice(i,i+len),start:base+i,end:base+i+len});
      }
    }
  }
  return arr;
}

async function ensureDictionary(text,log){
  if(!$("#online").checked) return;
  const seen=new Set();
  let calls=0;
  for(const m of possibleWords(text)){
    const w=m.word;
    if(seen.has(w)||getCandidates(w).length) continue;
    seen.add(w);
    if(calls>=24) break;
    calls++;
    try{
      const a=await termLookup(w);
      if(a.length){
        CACHE[w]=a;
        log.push(`인터넷 학습: ${w} → ${a.map(x=>x.hanja).join(", ")}`);
      }
    }catch(e){
      log.push(`온라인 조회 중단: ${e.message}`);
      break;
    }
  }
  localStorage.setItem("hanjaMixerCache",JSON.stringify(CACHE));
  status();
}

function findMatches(text){
  const words=[...new Set([...Object.keys(CACHE),...Object.keys(SEED)])].sort((a,b)=>b.length-a.length);
  let r=[],i=0;
  while(i<text.length){
    const w=words.find(x=>text.startsWith(x,i));
    if(w){r.push({word:w,start:i,end:i+w.length});i+=w.length}else i++;
  }
  return r;
}

function localConvert(text,strength,log){
  const reps=[];
  for(const m of findMatches(text)){
    const ctx=text.slice(Math.max(0,m.start-30),Math.min(text.length,m.end+30));
    const c=choose(m.word,ctx);
    if(!c) continue;
    reps.push({...m,h:c.hanja});
    log.push(`${m.word} → ${c.hanja} (${c.source||"캐시"}) · ${c.definition||""}`);
  }
  let out=text;
  for(const r of reps.sort((a,b)=>b.start-a.start)){
    out=out.slice(0,r.start)+r.h+out.slice(r.end);
  }
  if(strength>=3){
    out=out.replace(/(?<=[\u3400-\u9fff])\s+(?=[\u3400-\u9fff])/g,"");
  }
  return out;
}

$("#convert").onclick=async()=>{
  const text=$("#input").value;
  const strength=Number($("#strength").value);
  const log=[];
  $("#notice").textContent="사전을 확인하고 있습니다…";
  $("#convert").disabled=true;
  try{
    await ensureDictionary(text,log);
    const out=localConvert(text,strength,log);
    snapshot={original:text,converted:out};
    $("#original").textContent=text;
    $("#converted").textContent=out;
    $("#notice").textContent="변환 완료.";
    $("#logs").innerHTML="";
    for(const s of log){
      const d=document.createElement("div");
      d.className="log"; d.textContent=s;
      $("#logs").appendChild(d);
    }
  }catch(e){
    $("#notice").textContent="오류: "+e.message;
  }finally{
    $("#convert").disabled=false;
  }
};

async function cp(t,label,b){
  if(!t)return;
  try{await navigator.clipboard.writeText(t)}
  catch{
    const x=document.createElement("textarea");
    x.value=t;document.body.append(x);x.select();
    document.execCommand("copy");x.remove();
  }
  const o=b.textContent;b.textContent=label+" 복사됨";
  setTimeout(()=>b.textContent=o,1200);
}

$("#copyOriginal").onclick=e=>cp(snapshot.original,"원본",e.currentTarget);
$("#copyConverted").onclick=e=>cp(snapshot.converted,"변환문",e.currentTarget);
$("#saveKey").onclick=()=>{
  localStorage.setItem("stdictKey",$("#key").value.trim());
  $("#notice").textContent="API 키를 저장했습니다.";
};
$("#forgetKey").onclick=()=>{
  localStorage.removeItem("stdictKey");$("#key").value="";
  $("#notice").textContent="API 키를 삭제했습니다.";
};
$("#testProxy").onclick=async()=>{
  $("#notice").textContent="Worker 연결을 시험하고 있습니다…";
  try{
    const proxy=normalizeProxy($("#proxy").value);
    const key=$("#key").value.trim();
    if(!key) throw new Error("온용어 API 키를 먼저 입력해 주세요.");

    const u=buildLookupURL(proxy,key,"정부");
    const r=await fetch(u,{method:"GET"});
    const raw=await r.text();

    if(!r.ok) throw new Error("HTTP "+r.status+" · "+raw.slice(0,100));

    const j=JSON.parse(raw);
    const ro=j?.channel?.return_object;
    const groups=Array.isArray(ro)?ro:(ro?[ro]:[]);
    const bad=groups.find(g=>String(g?.returnCode??"") && String(g.returnCode)!=="1");
    if(bad) throw new Error(bad.message||("온용어 API 오류 코드 "+bad.returnCode));

    $("#notice").textContent="Worker 연결 성공 · 온용어 JSON 응답 확인.";
  }catch(e){
    $("#notice").textContent="연결 테스트 실패: "+e.message;
  }
};

$("#saveProxy").onclick=()=>{
  try{
    const p=normalizeProxy($("#proxy").value);
    $("#proxy").value=p;
    localStorage.setItem("hanjaProxy",p);
    $("#notice").textContent="Worker 주소를 저장했습니다.";
  }catch(e){
    $("#notice").textContent="Worker 주소 오류: "+e.message;
  }
};
$("#clear").onclick=()=>{
  $("#input").value="";$("#original").textContent="";$("#converted").textContent="";
  snapshot={original:"",converted:""};
};
load();
</script>
</body>
</html>
