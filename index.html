<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한자혼용 변환기 v0.6.1</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color-scheme:light dark}
body{max-width:920px;margin:auto;padding:22px;line-height:1.6}
textarea,input,select,button{font:inherit}
textarea{width:100%;box-sizing:border-box;min-height:160px;padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.box{border:1px solid #888;border-radius:10px;padding:12px;min-height:80px;white-space:pre-wrap}
.grid{display:grid;gap:18px}@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
input[type=password],input[type=url]{min-width:280px;padding:8px}
button,select{padding:8px 11px}
.small{font-size:.9rem;opacity:.85}
.log{border-top:1px solid #8885;padding:8px 0}
fieldset{border:1px solid #888;border-radius:10px}
</style>
</head>
<body>
<h1>한자혼용 변환기 <small>v0.6.1 Morphology False-Positive Fix</small></h1>
<p>GitHub Pages에서 실행하고, 국립국어원 온용어 요청은 Cloudflare Worker가 중계합니다.</p>

<fieldset>
<legend>연결 설정</legend>
<div class="row">
<label>Worker 주소
<input id="proxy" type="url" placeholder="https://xxxx.xxxx.workers.dev/"></label>
<button id="saveProxy">Worker 주소 저장</button>
<button id="testProxy">Worker 연결 테스트</button>
</div>
<div class="row">
<label>온용어 API 키
<input id="key" type="password" autocomplete="off" placeholder="발급받은 인증 키"></label>
<button id="saveKey">키 저장</button>
<button id="forgetKey">키 삭제</button>
</div>
<label><input id="online" type="checkbox" checked> 모르는 단어는 온용어에서 조회</label>
<p class="small">Worker 주소와 API 키는 이 브라우저의 localStorage에만 저장됩니다.</p>
<p class="small">v0.6.1: 어절 내부의 임의 사전 일치를 금지해 ‘강한→江漢’, ‘일어나고→日語나고’ 같은 오변환을 차단합니다.</p>
<button id="resetCache">학습 캐시 초기화</button> <span id="cacheStatus"></span>
</fieldset>

<p><label><strong>원문</strong></label></p>
<textarea id="input" placeholder="정부는 새로운 경제 정책을 발표하고 국제 금융 시장의 변화를 분석하였다."></textarea>

<div class="row">
<label>강도
<select id="strength">
<option value="1">1 — 약하게</option>
<option value="2" selected>2 — 일반 혼용</option>
<option value="3">3 — 옛 신문 풀파워</option>
</select></label>
<button id="convert">변환</button>
<button id="clear">초기화</button>
</div>

<p id="notice" role="status" aria-live="polite"></p>

<div class="grid">
<section><h2>변환 당시 원본</h2><div id="original" class="box"></div><button id="copyOriginal">원본 복사</button></section>
<section><h2>변환문</h2><div id="converted" class="box"></div><button id="copyConverted">변환문 복사</button></section>
</div>

<details><summary>판별/조회 기록</summary><div id="logs"></div></details>

<script>
const SEED={
"정부":[{hanja:"政府",definition:"나라의 행정을 맡아보는 국가 기관",source:"내장"}],
"경제":[{hanja:"經濟",definition:"재화와 용역의 생산 분배 소비와 관련된 활동",source:"내장"}],
"정책":[{hanja:"政策",definition:"정치적 목적을 실현하기 위한 방침",source:"내장"}],
"발표":[{hanja:"發表",definition:"어떤 사실이나 결과를 널리 알림",source:"내장"}],
"교육":[{hanja:"敎育",definition:"지식과 기능을 가르치고 인격을 기름",source:"내장"}],
"학생":[{hanja:"學生",definition:"학교에서 공부하는 사람",source:"내장"}],
"학습":[{hanja:"學習",definition:"배워서 익힘",source:"내장"}],
"환경":[{hanja:"環境",definition:"사람이나 생물을 둘러싼 주위 조건",source:"내장"}],
"개선":[{hanja:"改善",definition:"고쳐서 더 좋게 함",source:"내장"}],
"국제":[{hanja:"國際",definition:"나라와 나라 사이",source:"내장"}],
"금융":[{hanja:"金融",definition:"자금과 돈의 융통",source:"내장"}],
"시장":[{hanja:"市場",definition:"상품과 서비스가 거래되는 곳이나 영역",source:"내장"}],
"변화":[{hanja:"變化",definition:"상태나 성질이 달라짐",source:"내장"}],
"분석":[{hanja:"分析",definition:"대상을 나누어 자세히 살핌",source:"내장"}],
"연구":[{hanja:"硏究",definition:"깊이 조사하고 탐구함",source:"내장"}],
"기사":[
 {hanja:"記事",definition:"신문 잡지 방송 인터넷 등에 실린 보도 글 뉴스",source:"내장"},
 {hanja:"騎士",definition:"말을 타고 싸우는 중세의 무사 갑옷 왕국",source:"내장"},
 {hanja:"技士",definition:"기술 자격을 갖춘 기술자 엔지니어",source:"내장"}]
,"야당":[{hanja:"野黨",definition:"정권을 담당하고 있지 않은 정당. 여당에 상대하여 이르는 말",source:"내장 검증어"}]
,"강력":[{hanja:"强力",definition:"힘이나 영향이 강함",source:"내장 검증어"}]
,"반발":[{hanja:"反撥",definition:"어떤 상태나 행동에 맞서서 반대함",source:"내장 검증어"}]
,"야기":[{hanja:"惹起",definition:"일이나 사건 따위를 끌어 일으킴",source:"내장 검증어"}]

};

const $=s=>document.querySelector(s);
let CACHE={},snapshot={original:"",converted:""};

function load(){
  try{CACHE=JSON.parse(localStorage.getItem("hanjaMixerCache")||"{}")}catch{CACHE={}}
  $("#key").value=localStorage.getItem("stdictKey")||"";
  $("#proxy").value=localStorage.getItem("hanjaProxy")||"";
  status();
}
function status(){
  $("#cacheStatus").textContent=`내장 ${Object.keys(SEED).length}개 · 인터넷 캐시 ${Object.keys(CACHE).length}개 표제어`;
}
function getCandidates(w){
  const merged=[...(CACHE[w]||[]),...(SEED[w]||[])];
  const out=[],seen=new Set();
  for(const c of merged){
    const k=(c.hanja||"")+"|"+(c.definition||"");
    if(!seen.has(k)){seen.add(k);out.push(c)}
  }
  return out;
}

function toks(s){
  return new Set(String(s||"").match(/[가-힣]{2,}/g)||[]);
}

function bigrams(s){
  const clean=String(s||"").replace(/[^가-힣]/g,"");
  const set=new Set();
  for(let i=0;i<clean.length-1;i++) set.add(clean.slice(i,i+2));
  return set;
}

function semanticScore(c,ctx){
  const def=String(c.definition||"");
  const source=String(c.source||"");
  const d=toks(def+" "+source), x=toks(ctx);
  let score=0;

  // Exact Korean-token overlap is strongest.
  for(const t of x) if(d.has(t)) score+=8;

  // Character-bigram overlap catches inflected/related forms.
  const db=bigrams(def), xb=bigrams(ctx);
  let bi=0;
  for(const g of xb) if(db.has(g)) bi++;
  score+=Math.min(bi,12)*1.2;

  // Prefer candidates whose definition contains contextually common domain clues.
  const domainClues=[
    ["정치","정당","정부","국회","법안","여당","야당"],
    ["신문","보도","기사","언론","뉴스","방송"],
    ["기술","자격","기사","엔지니어","산업"],
    ["중세","무사","말","갑옷","왕국"],
    ["전기","전류","전압","전자","물리"],
    ["책","일생","인물","기록","전기"],
    ["수도","도시","정부","국가"],
    ["물","상수도","배관","수도"]
  ];
  for(const group of domainClues){
    const ctxHit=group.some(k=>ctx.includes(k));
    if(!ctxHit) continue;
    const defHits=group.filter(k=>def.includes(k)).length;
    score+=defHits*4;
  }

  // Trusted built-in regression terms get a small tie-break bonus, not a hard override.
  if(source.includes("내장 검증어")) score+=2.5;

  return score;
}

function choose(w,ctx){
  const a=getCandidates(w);
  if(!a.length) return null;
  const ranked=a.map(x=>({c:x,score:semanticScore(x,ctx)}))
                .sort((a,b)=>b.score-a.score);
  return {
    ...ranked[0].c,
    _score:ranked[0].score,
    _margin:ranked.length>1 ? ranked[0].score-ranked[1].score : 99,
    _alternatives:ranked.slice(1,4).map(r=>({hanja:r.c.hanja,score:r.score}))
  };
}
function cleanWord(w){return String(w||"").replace(/[-^·\d]+$/g,"").trim()}
function hanjaOnly(s){return (String(s||"").match(/[\u3400-\u9fff]+/g)||[]).join("")}

function normalizeItems(j,w){
  const ch=j?.channel||{};
  let ro=ch.return_object||[];
  if(!Array.isArray(ro)) ro=[ro];

  const out=[];
  for(const group of ro){
    let list=group?.resultlist||[];
    if(!Array.isArray(list)) list=[list];

    for(const it of list){
      if(!it) continue;
      const word=String(it.word||"").replace(/\^/g,"").trim();
      if(word!==w) continue;

      const origin=hanjaOnly(it.origin||"");
      if(!origin) continue;

      out.push({
        hanja:origin,
        definition:it.definition||"",
        pos:"",
        source:it.source||it.glossary||"국립국어원 온용어"
      });
    }
  }

  const uniq=[],seen=new Set();
  for(const x of out){
    const k=x.hanja+"|"+x.definition;
    if(!seen.has(k)){seen.add(k);uniq.push(x)}
  }
  return uniq;
}

function normalizeProxy(raw){
  let p=String(raw||"").trim();
  if(!p) throw new Error("Worker 주소가 없습니다.");
  if(!/^https?:\/\//i.test(p)) p="https://"+p;
  return p.replace(/\/+$/,"");
}

function buildLookupURL(proxy,key,w){
  const params=[
    ["key",key],
    ["apiSearchWord",w],
    ["start","1"],
    ["num","100"],
    ["sort","wt"]
  ];
  return proxy+"/?"+params.map(([k,v])=>
    encodeURIComponent(k)+"="+encodeURIComponent(String(v))
  ).join("&");
}

async function termLookup(w){
  const key=$("#key").value.trim();
  if(!key) throw new Error("온용어 API 키가 없습니다.");

  const proxy=normalizeProxy($("#proxy").value);
  const requestURL=buildLookupURL(proxy,key,w);

  let r;
  try{
    r=await fetch(requestURL,{method:"GET"});
  }catch(e){
    throw new Error("Worker 요청 실패: "+e.message);
  }

  if(!r.ok) throw new Error("Proxy HTTP "+r.status);

  const raw=await r.text();
  let j;
  try{
    j=JSON.parse(raw);
  }catch{
    throw new Error("온용어 응답이 JSON이 아닙니다: "+raw.replace(/\s+/g," ").slice(0,120));
  }

  const ro=j?.channel?.return_object;
  const groups=Array.isArray(ro)?ro:(ro?[ro]:[]);
  for(const g of groups){
    const code=String(g?.returnCode??"");
    if(code && code!=="1"){
      throw new Error(g?.message||("온용어 API 오류 코드 "+code));
    }
  }

  return normalizeItems(j,w);
}

const PARTICLES=[
  "으로부터","에게서","께서는","에서는","으로써","으로서","에게는","한테서",
  "까지는","부터는","에게","한테","께서","에서","으로","로서","로써",
  "하고","보다","처럼","만큼","조차","마저","부터","까지",
  "은","는","이","가","을","를","의","에","와","과","도","만","로","께"
];

const HADA_ENDINGS=[
  "하였습니다","했습니다","하였다","했다","하였고","했고","하였으며","했으며",
  "하겠다고","한다고","하였다가","하다가","하면서","하며","하고","하는","한",
  "하여","해서","하니","하면","하므로","함으로","합니다","한다","하다"
];

const DOEDA_ENDINGS=[
  "되었습니다","됐습니다","되었다","됐다","되었고","됐고","되었으며","됐으며",
  "되면서","되며","되고","되는","된","되어","돼서","되니","되면","됩니다","된다","되다"
];

const NATIVE_VERB_BLOCKERS=[
  "일어나","일어났","일어난","일어나고","일어나며","일어나서","일어나면",
  "들어나","돌아가","돌아오","알아보","알아내","바라보","내려가","내려오",
  "올라가","올라오","넘어가","넘어오","다가가","다가오","깨어나","태어나"
];

function uniqueCandidates(arr){
  const seen=new Set(),out=[];
  for(const x of arr){
    const k=x.word+"|"+x.start+"|"+x.end;
    if(x.word.length>=2 && !seen.has(k)){seen.add(k);out.push(x)}
  }
  return out;
}

function stripParticle(run,base){
  const out=[];
  for(const p of PARTICLES){
    if(run.endsWith(p) && run.length-p.length>=2){
      const stem=run.slice(0,-p.length);
      out.push({word:stem,start:base,end:base+stem.length,kind:"particle",tail:p});
    }
  }
  return out;
}

function stripPredicate(run,base){
  const out=[];

  // Native predicates such as "일어나고" must never be interpreted as
  // an embedded dictionary word ("일어" -> 日語).
  if(NATIVE_VERB_BLOCKERS.some(x=>run.startsWith(x))) return out;

  for(const ending of HADA_ENDINGS){
    if(run.endsWith(ending) && run.length-ending.length>=2){
      const stem=run.slice(0,-ending.length);
      out.push({word:stem,start:base,end:base+stem.length,kind:"hada",tail:ending});
    }
  }
  for(const ending of DOEDA_ENDINGS){
    if(run.endsWith(ending) && run.length-ending.length>=2){
      const stem=run.slice(0,-ending.length);
      out.push({word:stem,start:base,end:base+stem.length,kind:"doeda",tail:ending});
    }
  }
  return out;
}

function morphologyCandidatesForRun(run,base){
  const out=[];

  // IMPORTANT v0.6.1 rule:
  // A conversion candidate must coincide with the start of an eojeol and
  // either occupy the whole eojeol or leave only a recognized particle /
  // 하다·되다 ending. Arbitrary internal dictionary substrings are forbidden.
  if(run.length>=2){
    out.push({word:run,start:base,end:base+run.length,kind:"whole"});
  }

  out.push(...stripParticle(run,base));
  out.push(...stripPredicate(run,base));

  // Two-stage form: noun + predicate/adjectival ending + particle is uncommon,
  // but noun+particle is handled above. No generic prefix fallback here.
  return uniqueCandidates(out);
}

function possibleWords(text){
  const arr=[];
  for(const m of text.matchAll(/[가-힣]+/g)){
    arr.push(...morphologyCandidatesForRun(m[0],m.index));
  }

  const rank={particle:0,hada:0,doeda:0,whole:1};
  return uniqueCandidates(arr).sort((a,b)=>
    (rank[a.kind]??9)-(rank[b.kind]??9) ||
    b.word.length-a.word.length ||
    a.start-b.start
  );
}
async function ensureDictionary(text,log){
  if(!$("#online").checked) return;
  const seen=new Set();
  let calls=0;
  for(const m of possibleWords(text)){
    const w=m.word;
    if(seen.has(w)||getCandidates(w).length) continue;
    seen.add(w);
    if(calls>=36) break;
    calls++;
    try{
      const a=await termLookup(w);
      if(a.length){
        CACHE[w]=a;
        log.push(`인터넷 학습[${m.kind}]: ${w} → ${a.map(x=>x.hanja).join(", ")}`);
      }
    }catch(e){
      log.push(`온라인 조회 중단: ${e.message}`);
      break;
    }
  }
  localStorage.setItem("hanjaMixerCache",JSON.stringify(CACHE));
  status();
}

function findMatches(text){
  const dictSet=new Set([...Object.keys(CACHE),...Object.keys(SEED)]);
  const candidates=possibleWords(text).filter(m=>dictSet.has(m.word));

  // v0.6.1: no text.indexOf(dictionaryWord) fallback.
  // This prevents 강한 -> 江漢 and 일어나고 -> 日語나고.
  const priority={particle:0,hada:0,doeda:0,whole:1};
  candidates.sort((a,b)=>
    a.start-b.start ||
    (b.end-b.start)-(a.end-a.start) ||
    (priority[a.kind]??9)-(priority[b.kind]??9)
  );

  const chosen=[];
  let cursor=-1;
  for(const c of candidates){
    if(c.start<cursor) continue;
    chosen.push(c);
    cursor=c.end;
  }
  return chosen;
}

function localConvert(text,strength,log){
  const reps=[];
  for(const m of findMatches(text)){
    const ctx=text.slice(Math.max(0,m.start-45),Math.min(text.length,m.end+45));
    const c=choose(m.word,ctx);
    if(!c) continue;

    // Strength 1 skips low-confidence ambiguous choices.
    if(strength===1 && c._margin<2.5){
      log.push(`보류: ${m.word} · 문맥 판별 불확실 (점수 차 ${c._margin.toFixed(1)})`);
      continue;
    }

    reps.push({...m,h:c.hanja});
    const confidence=c._margin>=6?"높음":c._margin>=2.5?"보통":"낮음";
    const alts=c._alternatives?.length
      ? ` · 다른 후보 ${c._alternatives.map(x=>x.hanja+" "+x.score.toFixed(1)).join(", ")}`
      : "";
    log.push(`${m.word} → ${c.hanja} [${confidence}; ${c._score.toFixed(1)}점] (${c.source||"캐시"})${alts} · ${c.definition||""}`);
  }

  let out=text;
  for(const r of reps.sort((a,b)=>b.start-a.start)){
    out=out.slice(0,r.start)+r.h+out.slice(r.end);
  }

  if(strength>=3){
    out=out.replace(/(?<=[\u3400-\u9fff])\s+(?=[\u3400-\u9fff])/g,"");
  }
  return out;
}

$("#convert").onclick=async()=>{
  const text=$("#input").value;
  const strength=Number($("#strength").value);
  const log=[];
  $("#notice").textContent="사전을 확인하고 있습니다…";
  $("#convert").disabled=true;
  try{
    await ensureDictionary(text,log);
    const out=localConvert(text,strength,log);
    snapshot={original:text,converted:out};
    $("#original").textContent=text;
    $("#converted").textContent=out;
    $("#notice").textContent="변환 완료.";
    $("#logs").innerHTML="";
    for(const s of log){
      const d=document.createElement("div");
      d.className="log"; d.textContent=s;
      $("#logs").appendChild(d);
    }
  }catch(e){
    $("#notice").textContent="오류: "+e.message;
  }finally{
    $("#convert").disabled=false;
  }
};

async function cp(t,label,b){
  if(!t)return;
  try{await navigator.clipboard.writeText(t)}
  catch{
    const x=document.createElement("textarea");
    x.value=t;document.body.append(x);x.select();
    document.execCommand("copy");x.remove();
  }
  const o=b.textContent;b.textContent=label+" 복사됨";
  setTimeout(()=>b.textContent=o,1200);
}

$("#copyOriginal").onclick=e=>cp(snapshot.original,"원본",e.currentTarget);
$("#copyConverted").onclick=e=>cp(snapshot.converted,"변환문",e.currentTarget);
$("#saveKey").onclick=()=>{
  localStorage.setItem("stdictKey",$("#key").value.trim());
  $("#notice").textContent="API 키를 저장했습니다.";
};
$("#forgetKey").onclick=()=>{
  localStorage.removeItem("stdictKey");$("#key").value="";
  $("#notice").textContent="API 키를 삭제했습니다.";
};
$("#testProxy").onclick=async()=>{
  $("#notice").textContent="Worker 연결을 시험하고 있습니다…";
  try{
    const proxy=normalizeProxy($("#proxy").value);
    const key=$("#key").value.trim();
    if(!key) throw new Error("온용어 API 키를 먼저 입력해 주세요.");

    const u=buildLookupURL(proxy,key,"정부");
    const r=await fetch(u,{method:"GET"});
    const raw=await r.text();

    if(!r.ok) throw new Error("HTTP "+r.status+" · "+raw.slice(0,100));

    const j=JSON.parse(raw);
    const ro=j?.channel?.return_object;
    const groups=Array.isArray(ro)?ro:(ro?[ro]:[]);
    const bad=groups.find(g=>String(g?.returnCode??"") && String(g.returnCode)!=="1");
    if(bad) throw new Error(bad.message||("온용어 API 오류 코드 "+bad.returnCode));

    $("#notice").textContent="Worker 연결 성공 · 온용어 JSON 응답 확인.";
  }catch(e){
    $("#notice").textContent="연결 테스트 실패: "+e.message;
  }
};

$("#resetCache").onclick=()=>{
  localStorage.removeItem("hanjaMixerCache");
  CACHE={};
  status();
  $("#notice").textContent="기존 학습 캐시를 초기화했습니다. 다음 변환부터 v0.6.1 방식으로 다시 학습합니다.";
};
$("#saveProxy").onclick=()=>{
  try{
    const p=normalizeProxy($("#proxy").value);
    $("#proxy").value=p;
    localStorage.setItem("hanjaProxy",p);
    $("#notice").textContent="Worker 주소를 저장했습니다.";
  }catch(e){
    $("#notice").textContent="Worker 주소 오류: "+e.message;
  }
};
$("#clear").onclick=()=>{
  $("#input").value="";$("#original").textContent="";$("#converted").textContent="";
  snapshot={original:"",converted:""};
};
load();
</script>
</body>
</html>
